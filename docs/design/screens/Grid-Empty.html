  <style>
    body { margin: 0; font-family: 'Outfit', 'Helvetica Neue', Arial, sans-serif; background: #F7F3EC; color: #23211F; }
    a { color: #D4460F; } a:hover { color: #B93A0A; }
    .btn { font-family: 'Outfit', sans-serif; font-size: 16px; font-weight: 600; line-height: 1; padding: 18px; border: 0; border-radius: 999px; width: 100%; box-sizing: border-box; text-align: center; text-decoration: none; display: block; }
    .primary { background: #FF5A1F; color: #F7F3EC; }
    .secondary { background: #23211F; color: #F7F3EC; }
    .ghost { background: transparent; color: #6E6960; font-size: 14px; padding: 12px; }
    .field { display: flex; flex-direction: column; gap: 8px; }
    .field label { font-size: 12px; font-weight: 600; color: #6E6960; }
    .field input, .field textarea { font-family: 'Outfit', sans-serif; font-size: 16px; padding: 16px 18px; border: 0; border-radius: 999px; background: #FFFFFF; box-shadow: 0 2px 8px rgba(35,33,31,0.08); color: #23211F; width: 100%; box-sizing: border-box; }
    .field textarea { border-radius: 22px; resize: none; }
    .help { font-size: 13px; color: #6E6960; line-height: 1.4; }
    .h1 { font-weight: 800; font-size: 34px; letter-spacing: -0.03em; line-height: 1.05; }
    .back { width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(35,33,31,0.08); color: #23211F; text-decoration: none; }
    .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 9px 13px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 2px 8px rgba(35,33,31,0.08); }
    .chip.on { background: #23211F; color: #F7F3EC; }
    .chip.tint { background: #ECE6DA; box-shadow: none; color: #6E6960; }
    .tab { text-decoration: none; color: #9A958B; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 6px 0; position: relative; }
    .tab.on { color: #23211F; }
    .row { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid #E2DCD0; text-decoration: none; color: #23211F; }
    .row:last-child { border-bottom: 0; }
    .av { width: 52px; height: 52px; border-radius: 18px; flex-shrink: 0; position: relative; overflow: hidden; }
    .bubble { max-width: 78%; padding: 12px 16px; border-radius: 22px; font-size: 15px; line-height: 1.4; }
    .them { background: #FFFFFF; box-shadow: 0 2px 8px rgba(35,33,31,0.06); align-self: flex-start; border-bottom-left-radius: 8px; }
    .me { background: #23211F; color: #F7F3EC; align-self: flex-end; border-bottom-right-radius: 8px; }
    .sheet { position: absolute; left: 0; right: 0; bottom: 0; background: #F7F3EC; border-radius: 34px 34px 0 0; padding: 14px 20px 32px 20px; box-shadow: 0 -12px 40px rgba(35,33,31,0.18); display: flex; flex-direction: column; gap: 14px; }
    .handle { width: 40px; height: 5px; border-radius: 999px; background: #E2DCD0; align-self: center; }
    .dim { position: absolute; inset: 0; background: rgba(35,33,31,0.45); }
  </style>
